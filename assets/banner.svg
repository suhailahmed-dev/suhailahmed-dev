<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="230" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="226" rx="8" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Technical Grid -->
  <rect x="4" y="4" width="912" height="222" rx="6" fill="url(#gridPattern)"/>

  <!-- Top Accent Bar -->
  <line x1="2" y1="2" x2="220" y2="2" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="2" x2="918" y2="2" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>

  <!-- Monogram Box Left -->
  <g transform="translate(42, 38)">
    <rect width="64" height="64" rx="8" fill="#131d31" stroke="#0d9488" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="32" y="41" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" class="mono" letter-spacing="1">SB</text>
    <rect x="-2" y="-2" width="10" height="10" fill="#0d9488" rx="2" opacity="0.9"/>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(615, 38)">
    <rect width="263" height="28" rx="4" fill="#131d31" stroke="#0d9488" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981" filter="url(#tealGlow)"/>
    <text x="30" y="18" fill="#14b8a6" font-size="10" font-weight="600" class="mono" letter-spacing="0.5">STATUS: OPEN FOR REMOTE ROLES</text>
  </g>

  <!-- Main Identity Header -->
  <g transform="translate(130, 48)">
    <text x="0" y="8" fill="#14b8a6" font-size="11" font-weight="700" class="mono" letter-spacing="2">// DEVELOPER &amp; INSTRUCTOR //</text>
    <text x="0" y="42" fill="#ffffff" font-size="32" class="display" letter-spacing="0.5">SOHAIL AHMED BULEDI</text>
    <text x="0" y="68" fill="#94a3b8" font-size="13" font-weight="500" class="mono" letter-spacing="0.5">
      WEB DEVELOPER  •  PYTHON AUTOMATION  •  AI-ASSISTED SOFTWARE CRAFTSMAN
    </text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="42" y1="158" x2="878" y2="158" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Attributes Strip at Bottom -->
  <g transform="translate(42, 175)">
    <g transform="translate(0, 0)">
      <rect width="195" height="34" rx="4" fill="#131d31" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="12" y="21" fill="#14b8a6" font-size="11" font-weight="700" class="mono">FULL-STACK WEB</text>
      <text x="120" y="21" fill="#64748b" font-size="9" class="mono">PHP &amp; MYSQL</text>
    </g>

    <g transform="translate(210, 0)">
      <rect width="215" height="34" rx="4" fill="#131d31" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="12" y="21" fill="#38bdf8" font-size="11" font-weight="700" class="mono">PYTHON AUTOMATION</text>
      <text x="160" y="21" fill="#64748b" font-size="9" class="mono">SCRIPTS</text>
    </g>

    <g transform="translate(440, 0)">
      <rect width="215" height="34" rx="4" fill="#131d31" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="12" y="21" fill="#a78bfa" font-size="11" font-weight="700" class="mono">AI AGENTS &amp; TOOLS</text>
      <text x="145" y="21" fill="#64748b" font-size="9" class="mono">TASKEEN</text>
    </g>

    <g transform="translate(670, 0)">
      <rect width="208" height="34" rx="4" fill="#131d31" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="12" y="21" fill="#fbbf24" font-size="11" font-weight="700" class="mono">IT INSTRUCTOR</text>
      <text x="115" y="21" fill="#64748b" font-size="9" class="mono">HYDERABAD, PK</text>
    </g>
  </g>
</svg>