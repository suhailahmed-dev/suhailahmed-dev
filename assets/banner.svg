<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Technical Blueprint Grid -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.035"/>
      <circle cx="0" cy="0" r="1" fill="#14b8a6" fill-opacity="0.15"/>
    </pattern>

    <!-- Radial Ambient Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tealGlow" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="956" height="236" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Light Backdrops -->
  <rect x="2" y="2" width="956" height="236" rx="10" fill="url(#cyanGlow)"/>
  <rect x="2" y="2" width="956" height="236" rx="10" fill="url(#tealGlow)"/>

  <!-- Blueprint Grid -->
  <rect x="4" y="4" width="952" height="232" rx="8" fill="url(#gridPattern)"/>

  <!-- Top Accent Beam -->
  <line x1="2" y1="2" x2="280" y2="2" stroke="url(#accentLine)" stroke-width="3" stroke-linecap="round"/>
  <line x1="740" y1="2" x2="958" y2="2" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Monogram Hex Box -->
  <g transform="translate(40, 36)">
    <rect width="70" height="70" rx="12" fill="#111c2e" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="-2" y="-2" width="12" height="12" fill="#14b8a6" rx="3" opacity="0.9"/>
    <rect x="60" y="60" width="12" height="12" fill="#06b6d4" rx="3" opacity="0.7"/>
    <text x="35" y="45" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle" class="mono" letter-spacing="1.5">SB</text>
    <text x="35" y="62" fill="#14b8a6" font-size="8" font-weight="700" text-anchor="middle" class="mono" letter-spacing="0.5">CORE</text>
  </g>

  <!-- Top Right Live Status Pill -->
  <g transform="translate(640, 36)">
    <rect width="280" height="30" rx="6" fill="#111c2e" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="15" r="4.5" fill="#10b981" filter="url(#glowFilter)"/>
    <text x="28" y="19" fill="#34d399" font-size="10.5" font-weight="700" class="mono" letter-spacing="0.6">OPEN FOR REMOTE &amp; CONTRACT ROLES</text>
  </g>

  <!-- Center Identity Header -->
  <g transform="translate(132, 44)">
    <text x="0" y="8" fill="#14b8a6" font-size="11" font-weight="700" class="mono" letter-spacing="2">// SENIOR SYSTEMS ARCHITECT &amp; ALGORITHMIC DEV //</text>
    <text x="0" y="46" fill="#ffffff" font-size="34" class="display" letter-spacing="0.5">SOHAIL AHMED BULEDI</text>
    <text x="0" y="72" fill="#94a3b8" font-size="13.5" font-weight="500" class="mono" letter-spacing="0.4">
      Enterprise Web Platforms  •  Quant &amp; Algorithmic Engines  •  Multi-Agent AI Automation
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="162" x2="920" y2="162" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom Metric Badges (4 Segments) -->
  <g transform="translate(40, 178)">
    <!-- Badge 1: Web Systems -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="6" fill="#111c2e" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.3"/>
      <text x="14" y="18" fill="#14b8a6" font-size="11" font-weight="700" class="mono">WEB ARCHITECTURE</text>
      <text x="14" y="31" fill="#64748b" font-size="9" class="mono">PHP 8+ • MySQL • MVC</text>
    </g>

    <!-- Badge 2: Algo & Quant -->
    <g transform="translate(222, 0)">
      <rect width="218" height="38" rx="6" fill="#111c2e" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
      <text x="14" y="18" fill="#38bdf8" font-size="11" font-weight="700" class="mono">ALGO &amp; QUANT ENGINES</text>
      <text x="14" y="31" fill="#64748b" font-size="9" class="mono">75% Win Rate • 14.3K Orders</text>
    </g>

    <!-- Badge 3: Autonomous Agents -->
    <g transform="translate(452, 0)">
      <rect width="228" height="38" rx="6" fill="#111c2e" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
      <text x="14" y="18" fill="#a78bfa" font-size="11" font-weight="700" class="mono">MULTI-AGENT ORCHESTRATION</text>
      <text x="14" y="31" fill="#64748b" font-size="9" class="mono">15 Prompt Roles • APEX AI</text>
    </g>

    <!-- Badge 4: Production Instructor -->
    <g transform="translate(692, 0)">
      <rect width="228" height="38" rx="6" fill="#111c2e" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
      <text x="14" y="18" fill="#fbbf24" font-size="11" font-weight="700" class="mono">LEAD IT INSTRUCTOR</text>
      <text x="14" y="31" fill="#64748b" font-size="9" class="mono">Hyderabad, PK • GMT+5 Flexible</text>
    </g>
  </g>
</svg>