<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="236" rx="8" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Engineering Grid -->
  <rect x="4" y="4" width="912" height="232" rx="6" fill="url(#gridPattern)"/>

  <!-- Top Accent Bar -->
  <line x1="2" y1="2" x2="180" y2="2" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <line x1="740" y1="2" x2="918" y2="2" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>

  <!-- Monogram Box Left -->
  <g transform="translate(42, 42)">
    <rect width="64" height="64" rx="8" fill="#0d1117" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="32" y="41" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" class="mono" letter-spacing="1">SA</text>
    <rect x="-2" y="-2" width="10" height="10" fill="#10b981" rx="2" opacity="0.8"/>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(620, 42)">
    <rect width="258" height="26" rx="4" fill="#0d1117" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="16" cy="13" r="4" fill="#10b981" filter="url(#emeraldGlow)"/>
    <text x="30" y="17" fill="#10b981" font-size="10" font-weight="600" class="mono" letter-spacing="0.5">STATUS: ALL ENGINES ONLINE</text>
  </g>

  <!-- Main Identity Header -->
  <g transform="translate(130, 52)">
    <text x="0" y="8" fill="#10b981" font-size="11" font-weight="700" class="mono" letter-spacing="2">// AUTONOMOUS ARCHITECTURE //</text>
    <text x="0" y="42" fill="#ffffff" font-size="32" class="display" letter-spacing="0.5">SUHAIL AHMED BULEDI</text>
    <text x="0" y="68" fill="#94a3b8" font-size="13" font-weight="500" class="mono" letter-spacing="0.5">
      AI SYSTEMS ENGINEER  •  ALGORITHMIC TRADING ARCHITECT  •  AUTONOMOUS WORKFLOWS
    </text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="42" y1="165" x2="878" y2="165" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Telemetry Strip at Bottom -->
  <g transform="translate(42, 185)">
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="4" fill="#0d1117" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="12" y="21" fill="#f59e0b" font-size="11" font-weight="700" class="mono">75.0% WIN RATE</text>
      <text x="110" y="21" fill="#64748b" font-size="9" class="mono">EXNESS MT5</text>
    </g>

    <g transform="translate(195, 0)">
      <rect width="210" height="34" rx="4" fill="#0d1117" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="12" y="21" fill="#38bdf8" font-size="11" font-weight="700" class="mono">14,323 TRADES LOGGED</text>
      <text x="160" y="21" fill="#64748b" font-size="9" class="mono">SQLITE</text>
    </g>

    <g transform="translate(420, 0)">
      <rect width="200" height="34" rx="4" fill="#0d1117" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="12" y="21" fill="#10b981" font-size="11" font-weight="700" class="mono">15-AGENT CLUSTER</text>
      <text x="135" y="21" fill="#64748b" font-size="9" class="mono">APEX HUB</text>
    </g>

    <g transform="translate(635, 0)">
      <rect width="243" height="34" rx="4" fill="#0d1117" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <text x="12" y="21" fill="#a855f7" font-size="11" font-weight="700" class="mono">ZERO-TOUCH MEDIA</text>
      <text x="135" y="21" fill="#64748b" font-size="9" class="mono">4 NODES</text>
    </g>
  </g>
</svg>